# droid.ini - M18 Web Seq (browser Web MIDI) -> USB cable -> MASTER18 USB port (usb = 1)
# generated by m18-webseq
# (to use TRS MIDI1 instead, change every "usb = 1" to "trs = 1")
# track 1
[midiin]
    usb = 1
    channel = 1
    pitch1 = O1
    gate1 = G1.1
# track 2
[midiin]
    usb = 1
    channel = 2
    pitch1 = O2
    gate1 = G1.2
# track 3
[midiin]
    usb = 1
    channel = 3
    pitch1 = O3
    gate1 = G1.3
# track 4 (trigger mode - use gate G1.4)
[midiin]
    usb = 1
    channel = 4
    pitch1 = O4
    gate1 = G1.4
# clock + start
[midiin]
    usb = 1
    clock = _MIDI_CLK16
    start = _MIDI_START
# 16th clock as 0/5 V on O7
[copy]
    input = _MIDI_CLK16 * 0.5
    output = O7
# start/reset pulse as 0/5 V on O8
[copy]
    input = _MIDI_START * 0.5
    output = O8
