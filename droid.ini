# droid.ini - M18 Web Seq (browser Web MIDI) -> USB MIDI interface TRS out -> MASTER18 TRS MIDI IN
# generated by m18-webseq
# track 1
[midiin]
    trs = 1
    channel = 1
    pitch1 = O1
    gate1 = G1
# track 2
[midiin]
    trs = 1
    channel = 2
    pitch1 = O2
    gate1 = G2
# track 3
[midiin]
    trs = 1
    channel = 3
    pitch1 = O3
    gate1 = G3
# track 4 (trigger mode - use gate G4)
[midiin]
    trs = 1
    channel = 4
    pitch1 = O4
    gate1 = G4
# clock + start
[midiin]
    trs = 1
    clock = _MIDI_CLK16
    start = _MIDI_START
# 16th clock as 0/5 V on O7
[copy]
    input = _MIDI_CLK16 * 0.5
    output = O7
# start/reset pulse as 0/5 V on O8
[copy]
    input = _MIDI_START * 0.5
    output = O8
